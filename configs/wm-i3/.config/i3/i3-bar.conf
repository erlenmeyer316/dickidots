set $bg         #050907
set $bg2        #0B1410
set $green      #55E17A
set $green_hi   #A0FFB2
set $green_dim  #286B45
set $amber      #FFBB4D
set $red        #FF5C5C
set $muted      #77917E

bar {
    position top
    status_command ~/.config/i3/i3status/wrapper.sh
    font pango:JetBrainsMono Nerd Font 10

    colors {
      background    $bg
      statusline    $green
      separator     $gree_dim

      focused_workspace $green_hi $bg2 $green_hi
      active_workspace $green_dim $bg $green
      inactive_workspace $bg $bg $muted
      urgent_workspace $red $bg2 $red
      binding_mode $amber $bg2 $amber
    }
}
